name: phase5-living-city-preflight
on:
  push:
  pull_request:
jobs:
  phase5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ci/preflight.py
      - run: python ci/preflight_phase2.py
      - run: python ci/preflight_phase3.py
      - run: python ci/preflight_phase4.py
      - run: python ci/preflight_phase5.py
      - run: python ci/static_cpp_sanity.py
